# .codex/config.toml
# 이 파일은 Codex 전용 프로젝트 설정이다.
# Codex는 trusted project에서만 프로젝트 단위 .codex/config.toml을 로드한다.

# 명령 실행 전 사용자 확인을 요청할 수 있게 한다.
# git commit, git push, npm install 등 prompt rules와 함께 쓰기 좋다.
approval_policy = "on-request"

# Codex가 레포 내부 파일은 수정할 수 있게 하되,
# 전체 시스템 접근은 막는다.
sandbox_mode = "workspace-write"

# 복잡한 설계, 리팩터링, 디버깅에서 더 깊게 추론하도록 한다.
model_reasoning_effort = "high"

# Codex 웹 검색 모드.
# cached는 최신성이 조금 덜 필요한 문서 확인에 적합하다.
# OpenAI/Next/Claude 문서처럼 최신 확인이 필요한 경우에도
# Codex가 필요한 범위에서 검색을 사용할 수 있게 한다.
web_search = "cached"

# shell_environment_policy.include_only는 의도적으로 사용하지 않는다.
# include_only를 설정하면 whitelist에 없는 환경 변수가 제거되어
# npm, nvm, proxy, temp dir 관련 문제가 생길 수 있다.

# Next.js DevTools MCP 서버 설정.
# Codex는 MCP 설정을 .mcp.json이 아니라 config.toml에서 읽는다.
[mcp_servers.next-devtools]

# MCP 서버를 시작할 명령어.
command = "npx"

# next-devtools-mcp를 npx로 실행한다.
# -y는 설치 확인 프롬프트를 줄이기 위한 옵션이다.
args = ["-y", "next-devtools-mcp@latest"]

# MCP 서버 시작 대기 시간.
# 기본값보다 여유 있게 20초로 둔다.
startup_timeout_sec = 20

# MCP tool 1회 호출 제한 시간.
# 기본 60초를 명시적으로 둔다.
tool_timeout_sec = 60

# 서버를 활성화한다.
enabled = true

# MCP 서버 초기화에 실패해도 Codex 세션 시작 자체는 막지 않는다.
# 개발 서버가 꺼져 있거나 네트워크 이슈가 있어도 코딩 작업은 계속 가능해야 한다.
required = false